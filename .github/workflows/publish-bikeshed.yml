name: Publish Bikeshed Document

on:
  push:
    branches:
      - main
    paths:
      - 'docs/dash-json.bs'
      - 'docs/dash-json.md'
      - 'docs/Images/**'
      - '.github/workflows/publish-bikeshed.yml'
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    # Public Docker Hub mirror of the DASH-IF specs builder. The GHCR copy
    # (ghcr.io/dash-industry-forum/dashif-specs) only grants access to
    # selected repositories in the organisation.
    container:
      image: dashif/specs-builder:latest

    steps:
    - uses: actions/checkout@v4
    - name: Build
      env:
        # Reset OPTS to empty to make sure we are not using
        # interactive mode in CI
        OPTS:
      run: make -C docs -f /tools/Makefile spec SRC=dash-json.bs NAME=dash-json
    - name: Archive
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: docs/dist/

  package:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: docs/dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/dist

  publish:
    runs-on: ubuntu-latest
    needs: package
    steps:
        - name: Deploy to GitHub Pages
          uses: actions/deploy-pages@v4
